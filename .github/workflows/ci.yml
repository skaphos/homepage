name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in lockstep with hugo-pages.yml: this gate only means something if it
  # builds with the same Hugo that publishes the site. A moving 'latest' is
  # also what introduced the languageCode deprecation warning, which under the
  # strict check below would fail the build with no change to the repo.
  HUGO_VERSION: 0.165.0

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build with Hugo (strict)
        env:
          HUGO_ENVIRONMENT: production
        run: |
          set -euo pipefail
          rm -rf public
          # hugo exits 0 on some soft failures; treat WARN/ERROR output as fatal
          # so a bad ref or missing layout cannot reach main.
          hugo --minify --gc --logLevel warn 2>&1 | tee build.log
          if grep -qiE '^(WARN|ERROR)' build.log; then
            echo "::error::Hugo emitted warnings or errors; see log above."
            exit 1
          fi

      - name: Verify expected pages rendered
        run: |
          set -euo pipefail
          for page in index.html tools/index.html manifesto/index.html; do
            if [ ! -s "public/${page}" ]; then
              echo "::error::Expected page not rendered: public/${page}"
              exit 1
            fi
          done
          echo "Rendered $(find public -name '*.html' | wc -l) HTML pages."
